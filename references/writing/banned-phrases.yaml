# 禁用词表
# 本文件是 check_prose_quality.py 和 analyze_aigc_style.py 共享的禁用词数据源
# 修改本文件后，两个脚本会自动使用新的禁用词

# 空泛套话（必须避免）
vague_phrases:
  - "显著提升"
  - "显著提高"
  - "显著改善"
  - "显著增强"
  - "具有重要意义"
  - "具有重要价值"
  - "具有重要作用"
  - "取得了良好效果"
  - "取得了显著成效"
  - "具有广阔的应用前景"
  - "具有广阔的发展前景"
  - "为……奠定了基础"
  - "为……提供了新的思路"
  - "为……提供了新的方法"
  - "为……提供了新的视角"
  - "具有重要的理论价值"
  - "具有重要的实践价值"
  - "具有重要的现实意义"
  - "进行了深入的研究"
  - "进行了详细的分析"
  - "进行了系统的总结"
  - "具有很强的实用性"
  - "具有很高的效率"
  - "具有很好的效果"
  - "取得了重大突破"
  - "产生了深远影响"
  - "具有不可替代的作用"
  - "为……指明了方向"
  - "为……提供了有力支撑"
  - "为……奠定了坚实基础"

# 口语化表达（学术论文中应避免）
colloquial_phrases:
  - "做了"
  - "搞了"
  - "弄了"
  - "测了"
  - "写了个"
  - "做了个"
  - "搞了个"
  - "弄了个"
  - "看了一下"
  - "想了一下"
  - "试了一下"
  - "发现还不错"
  - "感觉挺好的"
  - "效果还行"

# AI 典型句型模式（正则表达式）
ai_sentence_patterns:
  - pattern: "通过……，使得……"
    description: "通过+使得 连用，主语缺失"
  - pattern: "通过……，实现了……"
    description: "通过+实现 连用，句式单调"
  - pattern: "通过……，达到了……"
    description: "通过+达到 连用，句式单调"
  - pattern: "通过……，取得了……"
    description: "通过+取得 连用，句式单调"
  - pattern: "通过……，获得了……"
    description: "通过+获得 连用，句式单调"
  - pattern: "首先……其次……最后……"
    description: "机械排比结构"
  - pattern: "一方面……另一方面……"
    description: "机械对比结构"
  - pattern: "不仅……而且……"
    description: "递进结构过度使用"

# 重复句式开头检测（连续 N 句以相同词开头）
repetitive_start_threshold: 3

# 长句阈值（字数）
long_sentence_threshold: 60

# 短段落阈值（字数）
short_paragraph_threshold: 80

# 学术表达推荐（用于替换禁用词）
recommended_replacements:
  "显著提升": "提升了 X%"
  "显著提高": "提高了 X%"
  "具有重要意义": "解决了……的实际问题"
  "取得了良好效果": "达到了预期目标，具体表现为……"
  "为……奠定了基础": "为……提供了技术支撑"
  "进行了深入的研究": "深入分析了……"
  "通过……，使得……": "通过……，系统……"（补充主语）
  "做了": "实现" / "完成" / "执行"
  "搞了": "开发" / "构建" / "设计"

# 领域术语词汇表
# 按论文类型分类，收录常用学术术语及其对应的 AI 易用错的替代词

# 软件工程类
software_engineering:
  # 正确表达
  correct:
    - "执行"
    - "实现"
    - "完成"
    - "优化"
    - "改进"
    - "提升"
    - "设计"
    - "构建"
    - "开发"
    - "部署"
    - "测试"
    - "验证"
    - "分析"
    - "评估"
    - "监控"
    - "维护"
    - "配置"
    - "集成"
    - "封装"
    - "抽象"
    - "重构"
    - "迭代"
    - "发布"
    - "回滚"
    - "扩容"
    - "降级"
    - "熔断"
    - "限流"

  # 错误表达（AI 常用）
  incorrect:
    - "进行了……的操作"
    - "做了……的事情"
    - "搞了……的测试"
    - "弄了……的代码"
    - "写了……的程序"
    - "搞了……的系统"
    - "做了……的功能"
    - "实现了……的效果"
    - "达到了……的目的"
    - "取得了……的成果"

  # 术语对照
  terminology:
    - term: "智能合约"
      english: "Smart Contract"
      description: "自动执行的计算机程序"
    - term: "区块链"
      english: "Blockchain"
      description: "分布式账本技术"
    - term: "微服务"
      english: "Microservices"
      description: "松耦合的服务架构"
    - term: "容器化"
      english: "Containerization"
      description: "应用打包技术"
    - term: "持续集成"
      english: "Continuous Integration, CI"
      description: "自动化构建和测试"
    - term: "持续部署"
      english: "Continuous Deployment, CD"
      description: "自动化发布流程"
    - term: "负载均衡"
      english: "Load Balancing"
      description: "流量分配机制"
    - term: "缓存"
      english: "Cache"
      description: "临时数据存储"
    - term: "消息队列"
      english: "Message Queue"
      description: "异步通信机制"
    - term: "API 网关"
      english: "API Gateway"
      description: "统一入口管理"

# 电子信息类
electronic_engineering:

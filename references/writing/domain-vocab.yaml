# 通用学术表达
general_academic:
  # 引出目的
  purpose:
    - "为解决……问题，本文提出……"
    - "针对……需求，本文设计……"
    - "围绕……目标，本文构建……"
    - "基于……理论，本文提出……"

  # 描述方法
  method:
    - "本文采用……方法"
    - "本文基于……技术"
    - "本文结合……和……"
    - "本文通过……实现……"

  # 描述结果
  result:
    - "实验结果表明……"
    - "测试结果显示……"
    - "数据分析证明……"
    - "对比实验说明……"

  # 总结贡献
  contribution:
    - "本文的主要贡献如下：（1）……；（2）……；（3）……"
    - "本文的创新点在于……"
    - "本文实现了……，达到了……目标"

  # 过渡衔接
  transition:
    - "在完成……的基础上，本章进一步……"
    - "基于上述分析，……"
    - "值得注意的是，……"
    - "综上所述，……"

# 禁用词表（通用）
banned_phrases:
  # 空泛表达
  vague:
    - "显著提升"
    - "显著提高"
    - "显著改善"
    - "显著增强"
    - "具有重要意义"
    - "具有重要价值"
    - "具有重要作用"
    - "取得了良好效果"
    - "取得了显著成效"
    - "具有广阔的应用前景"
    - "具有广阔的发展前景"
    - "为……奠定了基础"
    - "为……提供了新的思路"
    - "为……提供了新的方法"
    - "为……提供了新的视角"
    - "具有重要的理论价值"
    - "具有重要的实践价值"
    - "具有重要的现实意义"
    - "进行了深入的研究"
    - "进行了详细的分析"
    - "进行了系统的总结"
    - "具有很强的实用性"
    - "具有很高的效率"
    - "具有很好的效果"

  # 口语化表达
  colloquial:
    - "做了"
    - "搞了"
    - "弄了"
    - "测了"
    - "写了个"
    - "做了个"
    - "搞了个"
    - "弄了个"

  # 重复句式
  repetitive_patterns:
    - "通过……，使得……"
    - "通过……，实现了……"
    - "通过……，达到了……"
    - "通过……，取得了……"
    - "通过……，获得了……"
